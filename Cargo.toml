[package]
name = "vibecad"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
glam = { version = "0.34.3", features = ["bytemuck"] }
rfd = "0.18.0"
serde_json = "1.0.154"

[dev-dependencies]
# Validates the WGSL shader in `cargo test`, without a GPU; the version wgpu already uses.
naga = { version = "30.0.2", features = ["wgsl-in"] }
